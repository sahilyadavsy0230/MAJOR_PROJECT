<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecting to Dashboard – Prashant Group</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body style="display:flex; align-items:center; justify-content:center; min-height:100vh; background:#FAFBFC; font-family:'Manrope',sans-serif;">
  <div style="text-align:center;">
    <div style="width:48px; height:48px; border:4px solid var(--coral); border-top-color:transparent; border-radius:50%; animation:spin 0.8s linear infinite; margin:0 auto 1.5rem;"></div>
    <h3 style="font-family:'Instrument Serif',serif; font-size:2rem; margin:0 0 0.5rem;">Loading your portal...</h3>
    <p style="color:var(--ink-60); font-size:14px; margin:0;">Please wait while we verify your workspace.</p>
  </div>

  <style>
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const token = localStorage.getItem('token');
      if (!token) {
        window.location.href = '/login';
        return;
      }
      try {
        const payload = JSON.parse(atob(token.split('.')[1]));
        const role = payload.role;
        if (role === 'ADMIN') {
          window.location.href = '/dashboard/admin';
        } else if (role === 'WORKER') {
          window.location.href = '/dashboard/worker';
        } else if (role === 'SUPERVISOR') {
          window.location.href = '/dashboard/supervisor';
        } else if (role === 'CANDIDATE') {
          window.location.href = '/dashboard/candidate';
        } else {
          window.location.href = '/login';
        }
      } catch (e) {
        console.error('Error decoding token', e);
        localStorage.removeItem('token');
        window.location.href = '/login';
      }
    });
  </script>
</body>
</html>
