# ==============================================================================
# PRASHANT GROUP WORKFORCE MANAGEMENT PLATFORM
# Production Nginx Configuration with SSL/TLS Termination
# ==============================================================================

# Rate limiting zones (OWASP A07 & DDoS Mitigation)
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;

# Upstream FastAPI application server (Uvicorn)
upstream fast_api_backend {
    server 127.0.0.1:8000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

# ------------------------------------------------------------------------------
# 1. HTTP Server — Redirect all HTTP traffic to HTTPS (Port 80 -> 443)
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name prashantgroupindia.in www.prashantgroupindia.in;

    # Let's Encrypt ACME challenge location for auto-renewals
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    # Redirect all other traffic to HTTPS with 301 Permanent Redirect
    location / {
        return 301 https://$host$request_uri;
    }
}

# ------------------------------------------------------------------------------
# 2. HTTPS Server — SSL/TLS Termination & Reverse Proxy (Port 443)
# ------------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name prashantgroupindia.in www.prashantgroupindia.in;

    # ── SSL Certificates (Let's Encrypt / Custom CA) ─────────────────────────
    ssl_certificate /etc/letsencrypt/live/prashantgroupindia.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/prashantgroupindia.in/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/prashantgroupindia.in/chain.pem;

    # ── Modern TLS Protocols & Ciphers (OWASP / Mozilla Intermediate) ───────
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;

    # ── SSL Performance & Caching ────────────────────────────────────────────
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;

    # ── OCSP Stapling (Improves TLS handshake speed & privacy) ──────────────
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 1.1.1.1 valid=300s;
    resolver_timeout 5s;

    # ── Security Headers ─────────────────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(self), camera=(), microphone=()" always;

    # Upload size limit for resumes, ID proofs and appointment letters
    client_max_body_size 25M;
    client_body_timeout 30s;
    client_header_timeout 30s;

    # Logging (Structured combined log format for Datadog / CloudWatch)
    access_log /var/log/nginx/prashant_access.log combined;
    error_log /var/log/nginx/prashant_error.log warn;

    # ── Static Files Caching (Browser cache 30 days) ─────────────────────────
    location /static/ {
        alias /app/frontend/static/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # ── Uploaded Documents (Restricted access) ────────────────────────────────
    location /uploads/ {
        alias /app/uploads/;
        expires 7d;
        add_header Cache-Control "private";
    }

    # ── Strict Rate Limiting on Authentication Endpoints ──────────────────────
    location ~* ^/api/v1/auth/(login|forgot-password|reset-password) {
        limit_req zone=auth_limit burst=3 nodelay;

        proxy_pass http://fast_api_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Main Application Proxy ───────────────────────────────────────────────
    location / {
        limit_req zone=api_limit burst=50 nodelay;

        proxy_pass http://fast_api_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_buffering on;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }
}
